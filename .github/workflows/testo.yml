on:
  pull_request: null
  push:
    branches:
      - 3.x

name: testo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      extensions: sockets, grpc
      os: >-
        ['ubuntu-latest']
      dependencies: >-
        ['lowest', 'highest']
      # ext-grpc leaves its threads running at exit: once PHP dlcloses grpc.so in module shutdown,
      # they jump into unmapped code and the run segfaults (exit 139) after all tests pass.
      run: ZEND_DONT_UNLOAD_MODULES=1 vendor/bin/testo
      codecov: true
      codecov-php: '8.4'
      codecov-dependencies: highest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
