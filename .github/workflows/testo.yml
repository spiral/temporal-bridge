on:
  pull_request: null
  push:
    branches:
      - master
      - '*.*'

name: testo

permissions:
  contents: read

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      extensions: sockets, grpc
      os: >-
        ['ubuntu-latest']
      dependencies: >-
        ['lowest', 'highest']
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
